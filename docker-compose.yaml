version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: admin-portal-postgres
    environment:
      POSTGRES_DB: admin_portal_api
      POSTGRES_USER: admin_portal
      POSTGRES_PASSWORD: admin_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
